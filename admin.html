<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>McSlice Rush · Performance</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --ink: #0a0a0a;
        --ink-2: #6b6b70;
        --ink-3: #a6a6ab;
        --line: #e8e8ea;
        --card: #ffffff;
        --red: #cc083e; /* wordmark only — never used as a UI color */
        --jade: #00764f; /* the one accent — chart line, active pill, badge */
        --jade-soft: rgba(0, 118, 79, 0.09);
        --up: #0f7a45; /* muted green for positive deltas */
        --down: #a3372f; /* muted red for negative deltas (not brand red) */
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        font:
          15px/1.5 -apple-system,
          'Inter',
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .page {
        max-width: 1060px;
        margin: 0 auto;
        padding: 56px 32px 80px;
      }

      /* ---- Header ---------------------------------------------------- */
      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }
      .mark {
        font-size: 15px;
      }
      .mark b {
        color: var(--red);
        font-weight: 800;
      }
      .mark span {
        color: var(--ink-3);
        font-weight: 500;
      }

      .range {
        display: flex;
        gap: 4px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 3px;
      }
      .range button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
        background: transparent;
        border: 0;
        border-radius: 7px;
        padding: 6px 14px;
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .range button:hover {
        color: var(--ink);
      }
      .range button.active {
        background: var(--jade);
        color: #fff;
      }

      /* ---- Hero row ---------------------------------------------------- */
      .hero {
        display: flex;
        flex-wrap: wrap;
        margin: 56px 0 64px;
      }
      .stat {
        flex: 1 1 150px;
        padding: 0 28px;
        border-left: 1px solid var(--line);
      }
      .stat:first-child {
        padding-left: 0;
        border-left: 0;
      }
      .stat .lbl {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--ink-2);
        margin-bottom: 12px;
      }
      .stat .num {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .stat .delta {
        margin-top: 12px;
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stat .delta.up {
        color: var(--up);
      }
      .stat .delta.down {
        color: var(--down);
      }
      .stat.commission .num {
        font-size: 30px;
        color: var(--jade);
      }
      .stat.commission .lbl small {
        display: block;
        font-weight: 500;
        text-transform: none;
        letter-spacing: 0;
        color: var(--ink-3);
        margin-top: 2px;
      }

      @media (max-width: 640px) {
        .stat {
          flex: 1 1 42%;
          border-left: 0 !important;
          padding: 0 !important;
          margin-bottom: 24px;
        }
      }

      /* ---- Panels ---------------------------------------------------- */
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px 28px;
      }
      .panel + .panel {
        margin-top: 20px;
      }
      .panel-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .panel h2 {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .panel-sub {
        font-size: 12.5px;
        color: var(--ink-3);
      }
      #chart-revenue {
        width: 100%;
      }

      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      @media (max-width: 720px) {
        .cols {
          grid-template-columns: 1fr;
        }
      }

      /* ---- Top rewards list ---------------------------------------------------- */
      .rewards {
        list-style: none;
      }
      .reward-row {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .reward-row:last-child {
        border-bottom: 0;
      }
      .reward-row .line {
        display: flex;
        justify-content: space-between;
        font-size: 13.5px;
        margin-bottom: 6px;
      }
      .reward-row .label {
        font-weight: 600;
      }
      .reward-row .n {
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
      }
      .reward-row .bar {
        height: 4px;
        border-radius: 3px;
        background: var(--jade-soft);
        overflow: hidden;
      }
      .reward-row .bar i {
        display: block;
        height: 100%;
        background: var(--jade);
        border-radius: 3px;
      }

      /* ---- Recent orders list ---------------------------------------------------- */
      .orders {
        list-style: none;
      }
      .order-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13.5px;
      }
      .order-row:last-child {
        border-bottom: 0;
      }
      .order-row .phone {
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
      }
      .order-row .amt {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .order-row .when {
        color: var(--ink-3);
        font-size: 12px;
        width: 72px;
        text-align: right;
      }

      .foot {
        text-align: center;
        font-size: 12px;
        color: var(--ink-3);
        margin-top: 56px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top">
        <div class="mark"><b>Krispy Kreme</b> <span>· performance, powered by Slicy-P</span></div>
        <div class="range" id="range-pills">
          <button data-range="today">Today</button>
          <button data-range="7d">7d</button>
          <button class="active" data-range="30d">30d</button>
        </div>
      </div>

      <div class="hero" id="hero"></div>

      <div class="panel">
        <div class="panel-head">
          <h2>Revenue</h2>
          <span class="panel-sub" id="chart-sub"></span>
        </div>
        <canvas id="chart-revenue" height="90"></canvas>
      </div>

      <div class="cols">
        <div class="panel">
          <div class="panel-head"><h2>Top Rewards Redeemed</h2></div>
          <ul class="rewards" id="rewards-list"></ul>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Recent Orders</h2></div>
          <ul class="orders" id="orders-list"></ul>
        </div>
      </div>

      <div class="foot">Sample data shown for illustration.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
