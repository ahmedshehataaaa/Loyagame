name: verify

# Every gate that exists as an npm script, run automatically. Until this
# existed, `npm run verify` was something a human had to remember — which is
# how a project ends up with a clean-looking suite that nobody has run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: format, lint, types, manifests, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs format:check, lint, typecheck, validate:campaigns and the unit
      # tests — the same command a developer runs locally, so CI cannot drift
      # from it.
      - run: npm run verify

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if the bundle regressed badly
        # A cheap guard on the thing most likely to regress silently: an
        # inlined sourcemap once took this from 76 KB to 409 KB.
        run: |
          size=$(stat -c%s dist/app.*.js | head -1)
          echo "app bundle: $((size / 1024)) KB"
          test "$size" -lt 204800
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  browser:
    name: browser tests (6 viewports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # dist/ must exist or production-build.spec.js skips itself, and a
      # silently-skipped production check is worse than no check.
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
