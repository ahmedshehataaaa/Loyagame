<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#DA291C" />
    <title>McSlice Rush</title>
    <script>
      /* A tenant page (/play/<slug>/, ADR 0018) shares this file with the
         McDonald's build. Blank the McDonald's title and boot mark before first
         paint; src/main.js sets the tenant's own once its manifest applies. */
      if (/^\/play\/[a-z0-9]/.test(location.pathname)) {
        document.title = '';
        document.documentElement.classList.add('is-tenant');
      }
    </script>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/screens.css" />
    <link rel="stylesheet" href="src/styles/reference.css" />

    <style>
      /* Inlined deliberately: an external stylesheet cannot style the thing that
       covers the wait for external stylesheets. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: #7d1109;
        color: #fff8f6;
        font:
          600 13px/1.4 system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #boot img {
        filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.35));
      }
      #boot-bar {
        width: 132px;
        height: 8px;
        border: 3px solid #27251f;
        border-radius: 999px;
        background: #5c0d07;
        overflow: hidden;
      }
      #boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #ffc72c;
        animation: boot-slide 1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-bar i {
          animation: none;
          width: 100%;
        }
      }
      .is-tenant #boot img {
        display: none;
      }
      .is-tenant #boot {
        background: #1c1917;
      }
    </style>

    <!-- Hero art the first screen needs. -->
    <link rel="preload" as="image" href="assets/brand-logo.png" />
    <link rel="preload" as="image" href="assets/items/bigmac.png" />
  </head>
  <body>
    <!-- Pre-boot loading state. Inline (no CSS/JS dependency) so it paints on the
       first frame and covers exactly the gap it exists for: module evaluation
       and first render. src/main.js removes it on the first route paint. -->
    <div id="boot" role="status" aria-live="polite">
      <img src="assets/brand-logo.png" alt="" width="72" height="72" />
      <div id="boot-bar"><i></i></div>
      <p>Loading&hellip;</p>
    </div>

    <div id="app">
      <!-- The canvas engine binds #game once at load, so the stage lives in
         the shell for the whole session. /play reveals it; every other
         route leaves it hidden behind the routed content. -->
      <div id="stage" class="game-stage"><canvas id="game"></canvas></div>

      <main id="route"></main>
    </div>

    <noscript>
      <p style="padding: 24px; text-align: center">
        McSlice Rush needs JavaScript enabled to play.
      </p>
    </noscript>

    <!-- Engine: classic IIFE scripts exposing globals, loaded before the app. -->
    <script src="engine/config.js"></script>
    <script src="engine/platform.js"></script>
    <script src="engine/audio.js"></script>
    <script src="engine/game.js"></script>

    <script type="module" src="src/main.js"></script>

    <script>
      /* The service worker was never registered — so the PWA manifest promised
         installability and offline play that did not exist. Registered after
         `load` so it never competes with first paint for bandwidth. */
      if ('serviceWorker' in navigator) {
        addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((err) => {
            // Offline support is a bonus, not a requirement: a failed
            // registration must never surface to the player.
            console.warn('service worker registration failed', err);
          });
        });
      }
    </script>
  </body>
</html>
