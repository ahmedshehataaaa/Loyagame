<img alt="Fries" class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rotate-90 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtTyAD32N8_05eS-0ii9Vn1LeKHmyekNcnfVWm43gAUV9Fwb4Ya-lz1TCQ6IAEg5DVW1h3UEGzoKp9Um4DCYoaIpT5eaHeqsd6XxapJ9ZmLXGxQ7DFgU0IAqnxlT-4_2FvT7YwYCcbp1TIEx7eoD0MDyAn1Vm_kq2BWk4-AnI7okTHr9LHnsc3Z-_MFoXZ3yqNFEHq8aboLnXNcKaxzodMmL1nyJeujjG1cWvs_j9h6aDvdmoK-Z_8957LF"/>
<img alt="Nuggets" class="absolute bottom-4 left-1/2 -translate-x-1/2 w-12 h-12 rotate-180 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtTyAD32N8_05eS-0ii9Vn1LeKHmyekNcnfVWm43gAUV9Fwb4Ya-lz1TCQ6IAEg5DVW1h3UEGzoKp9Um4DCYoaIpT5eaHeqsd6XxapJ9ZmLXGxQ7DFgU0IAqnxlT-4_2FvT7YwYCcbp1TIEx7eoD0MDyAn1Vm_kq2BWk4-AnI7okTHr9LHnsc3Z-_MFoXZ3yqNFEHq8aboLnXNcKaxzodMmL1nyJeujjG1cWvs_j9h6aDvdmoK-Z_8957LF"/>
<img alt="Apple Pie" class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 -rotate-90 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtTyAD32N8_05eS-0ii9Vn1LeKHmyekNcnfVWm43gAUV9Fwb4Ya-lz1TCQ6IAEg5DVW1h3UEGzoKp9Um4DCYoaIpT5eaHeqsd6XxapJ9ZmLXGxQ7DFgU0IAqnxlT-4_2FvT7YwYCcbp1TIEx7eoD0MDyAn1Vm_kq2BWk4-AnI7okTHr9LHnsc3Z-_MFoXZ3yqNFEHq8aboLnXNcKaxzodMmL1nyJeujjG1cWvs_j9h6aDvdmoK-Z_8957LF"/>
</div>
</div>
<!-- Pointer -->
<div class="absolute -top-4 left-1/2 -translate-x-1/2 z-20">
<div class="w-8 h-10 bg-on-surface clip-path-triangle transform rotate-180 shadow-lg">
<div class="w-full h-full bg-white scale-75 clip-path-triangle"></div>
</div>

<!-- Center Cap -->
<div class="absolute w-12 h-12 bg-white border-4 border-on-surface rounded-full z-20 flex items-center justify-center arcade-shadow">
<div class="w-4 h-4 bg-primary rounded-full"></div>
</div>

        Spin!

<div class="flex flex-col items-center p-md bg-surface-container rounded-[32px] border-b-[8px] border-on-surface arcade-shadow relative overflow-hidden">
<p class="text-label-bold font-label-bold text-on-surface-variant uppercase mb-md">Lucky Peel</p>
<div class="relative w-full max-w-[280px] aspect-[3/4] bg-secondary-container rounded-2xl border-4 border-on-surface overflow-hidden group">

<!-- Peeling Corner Effect -->

</div>
</div>

</div>

<!-- Bottom CTA -->

<span class="material-symbols-outlined font-bold">confirmation_number</span>
      Claim My Rewards
    </button>
<p class="text-label-bold font-label-bold text-on-primary/60 mt-md uppercase tracking-widest">Expires in 24 Hours</p>

<style>
    .clip-path-triangle {
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }
    .peel-off {
      transform: translate(-120%, 120%) rotate(-45deg);
    }
  </style>
<script>
    function spinWheel() {
      const wheel = document.getElementById('prize-wheel');
      const randomRotation = Math.floor(Math.random() * 360) + 1440; // At least 4 full spins
      wheel.style.transform = `rotate(${randomRotation}deg)`;
      
      // Basic haptic feedback feel
      setTimeout(() => {
        createConfettiBurst();
      }, 3000);
    }

    const peelLayer = document.getElementById('peel-layer');
    peelLayer.addEventListener('click', () => {
      peelLayer.classList.add('peel-off');
      createConfettiBurst();
    });

    function createConfettiBurst() {
      const container = document.getElementById('confetti-container');
      const colors = ['#b50303', '#775a00', '#ffc72c', '#ffffff'];
      
      for (let i = 0; i < 40; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'absolute w-3 h-3 rounded-sm z-0';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.top = '-10px';
        
        const animation = confetti.animate([
          { transform: 'translateY(0) rotate(0)', opacity: 1 },
          { transform: `translateY(100vh) translateX(${Math.random() * 100 - 50}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
        ], {
          duration: 2000 + Math.random() * 2000,
          easing: 'cubic-bezier(0, .9, .57, 1)'
        });
        
        container.appendChild(confetti);
        animation.onfinish = () => confetti.remove();
      }
    }

    // Initial festive burst
    setTimeout(createConfettiBurst, 500);
  </script>
</div></main></body></html>
