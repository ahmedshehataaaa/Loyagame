<!-- Confetti/Sparkle Particles for micro-interaction -->
<script>
    document.querySelectorAll('.arcade-shadow').forEach(card => {
      card.addEventListener('click', (e) => {
        const rect = card.getBoundingClientRect();
        for(let i=0; i<6; i++) {
          createParticle(e.clientX, e.clientY);
        }
      });
    });

    function createParticle(x, y) {
      const p = document.createElement('div');
      p.className = 'fixed pointer-events-none z-[100] rounded-full';
      const colors = ['#ffc72c', '#da291c', '#ffffff'];
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.width = Math.random() * 8 + 4 + 'px';
      p.style.height = p.style.width;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      document.body.appendChild(p);

      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 10 + 5;
      const vx = Math.cos(angle) * velocity;
      const vy = Math.sin(angle) * velocity;
      let opacity = 1;

      const anim = () => {
        const currentX = parseFloat(p.style.left);
        const currentY = parseFloat(p.style.top);
        p.style.left = (currentX + vx) + 'px';
        p.style.top = (currentY + vy) + 'px';
        opacity -= 0.05;
        p.style.opacity = opacity;
        if(opacity > 0) requestAnimationFrame(anim);
        else p.remove();
      };
      requestAnimationFrame(anim);
    }
  </script>
