<script>
    // Micro-interactions and Canvas Slice Trail
    const canvas = document.getElementById('slice-canvas');
    const ctx = canvas.getContext('2d');
    let points = [];

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      points.push({
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        age: 0
      });
      triggerScorePop();
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      points.push({
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top,
        age: 0
      });
    }, { passive: false });

    function triggerScorePop() {
      const pop = document.getElementById('score-pop');
      if (Math.random() > 0.95) {
        pop.classList.remove('opacity-0', 'translate-y-4');
        pop.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          pop.classList.add('opacity-0', 'translate-y-4');
          pop.classList.remove('opacity-100', 'translate-y-0');
        }, 800);
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (points.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffc72c';
        
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
      }

      for (let i = 0; i < points.length; i++) {
        points[i].age++;
      }
      points = points.filter(p => p.age < 12);
      
      requestAnimationFrame(animate);
    }
    animate();

    // Timer countdown visual simulation
    let timeLeft = 45;
    setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        const percent = (timeLeft / 60) * 100;
        document.getElementById('timer-fill').style.height = percent + '%';
      }
    }, 1000);
  </script>
